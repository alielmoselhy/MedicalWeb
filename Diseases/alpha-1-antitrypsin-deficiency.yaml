id: alpha-1-antitrypsin-deficiency
name: Alpha-1 antitrypsin deficiency
group: airways
status: draft
systems: [respiratory, gastrointestinal]
sources: ["K&C 10e p.955-957", "Mehlman HY Pulmonary", "LMC 2026 Non-viral liver s.35-36"]
chain:
  - {from: serpina1-mutation, to: hepatic-a1at-retention, note: "Codominant: ZZ is the disease genotype, MZ partial; the protein builds up in the liver instead of being secreted", source: "K&C 10e p.956"}
  - [hepatic-a1at-retention, a1at-deficiency-state]
  - [hepatic-a1at-retention, low-a1at-level]
  - {from: a1at-deficiency-state, to: alveolar-wall-destruction, note: "Unopposed neutrophil elastase; pan-acinar emphysema (smokers get centri-acinar)", source: "K&C 10e p.955-956"}
  - [smoking, smoking-protease-excess]
  - [smoking-protease-excess, alveolar-wall-destruction]
  - [alveolar-wall-destruction, air-trapping]
  - [air-trapping, obstructive-spirometry]
  - [air-trapping, hyperinflation-imaging]
  - [alveolar-wall-destruction, diffusion-impairment]
  - [diffusion-impairment, reduced-tlco]
  - [diffusion-impairment, exertional-dyspnoea]
  - [hepatic-a1at-retention, a1at-globules]
  - [alveolar-wall-destruction, copd]
  - [hepatic-a1at-retention, cirrhosis]
  - [cirrhosis, hepatocellular-carcinoma]
findings:
  - {id: low-a1at-level, freq: classic, note: "Check level and genotype in younger patients or with a family history", source: "K&C 10e p.957"}
  - {id: exertional-dyspnoea, freq: common}
  - {id: obstructive-spirometry, freq: common}
  - {id: reduced-tlco, freq: common}
  - {id: hyperinflation-imaging, freq: common, note: "Bullous changes", source: "Mehlman HY Pulmonary"}
  - {id: a1at-globules, freq: classic, note: "The abnormal (PiZZ) protein can't be secreted and builds up in hepatocytes", source: "LMC 2026 Non-viral liver s.35-36"}
outcomes:
  - {id: copd, note: "≈2% of UK emphysema; suspect in a young patient, a non-smoker or with a family history", source: "K&C 10e p.956-957"}
  - {id: cirrhosis, note: "From protein retained in hepatocytes", source: "K&C 10e p.956"}
  - {id: hepatocellular-carcinoma, freq: rare, note: "Also neonatal hepatitis", source: "LMC 2026 Non-viral liver s.35"}
