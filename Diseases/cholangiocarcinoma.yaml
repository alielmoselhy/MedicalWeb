id: cholangiocarcinoma
name: Cholangiocarcinoma
group: biliary-pancreas
status: draft
systems: [gastrointestinal]
sources: ["K&C 10e p.1299, 1310, 1322-1323", "Mehlman HY Gastro", "LMC 2025 HPB pathology s.33-41", "LMC 2026 Cirrhosis s.37-38"]
chain:
  - {from: primary-sclerosing-cholangitis, to: inflammation-driven-transformation, note: "Up to 15% of PSC; also linked to IBD and choledochal cysts", source: "K&C 10e p.1299, 1322"}
  - {from: liver-fluke, to: inflammation-driven-transformation, note: "Chronic fluke infection where it is endemic", source: "K&C 10e p.1310, 1322"}
  - {from: smoking, to: carcinogen-induced-transformation, note: "A risk factor, as for pancreatic cancer", source: "Mehlman HY Gastro"}
  - [inflammation-driven-transformation, biliary-tract-tumour]
  - [carcinogen-induced-transformation, biliary-tract-tumour]
  - {from: biliary-tract-tumour, to: bile-duct-obstruction, note: "Perihilar (Klatskin, 50–60%) and distal tumours present with jaundice; intrahepatic ones (10%) behave like HCC", source: "K&C 10e p.1310, 1322; LMC 2025 HPB pathology s.35"}
  - [bile-duct-obstruction, jaundice]
  - [bile-duct-obstruction, dilated-bile-ducts]
  - [bile-duct-obstruction, cholestatic-pattern]
  - {from: biliary-tract-tumour, to: bile-duct-stricturing, note: "MRCP: a stricture with dilated ducts above it", source: "K&C 10e p.1322"}
  - {from: biliary-tract-tumour, to: local-tumour-invasion, note: "Early perineural, vascular and lymphatic spread; usually found late", source: "K&C 10e p.1322"}
  - {from: hepatitis-c, to: inflammation-driven-transformation, note: "Intrahepatic tumours: also HIV, cirrhosis, obesity, alcohol, diabetes", source: "LMC 2025 HPB pathology s.34"}
  - {from: cirrhosis, to: inflammation-driven-transformation, source: "LMC 2025 HPB pathology s.34"}
  - {from: obesity, to: carcinogen-induced-transformation, source: "LMC 2025 HPB pathology s.34"}
  - {from: excess-alcohol, to: carcinogen-induced-transformation, source: "LMC 2025 HPB pathology s.34"}
  - {from: diabetes-mellitus, to: malignant-transformation, source: "LMC 2025 HPB pathology s.34"}
  - [biliary-tract-tumour, weight-loss]
  - [bile-duct-obstruction, pale-stools-dark-urine]
  - [bile-duct-obstruction, pruritus]
  - [local-tumour-invasion, abdominal-pain]
  - [biliary-tract-tumour, hepatomegaly]
  - [biliary-tract-tumour, raised-ca19-9]
  - [bile-duct-obstruction, acute-cholangitis]
findings:
  - {id: jaundice, freq: classic, note: "Like pancreatic cancer but with a normal pancreas on CT", source: "Mehlman HY Gastro"}
  - {id: dilated-bile-ducts, freq: classic}
  - {id: bile-duct-stricturing, freq: classic}
  - {id: cholestatic-pattern, freq: common}
  - {id: weight-loss, freq: common, note: "Cachexia, night sweats, fever; symptoms come late", source: "LMC 2025 HPB pathology s.36"}
  - {id: night-sweats, freq: occasional, source: "LMC 2025 HPB pathology s.36"}
  - {id: abdominal-pain, freq: common, source: "LMC 2025 HPB pathology s.36"}
  - {id: pruritus, freq: common, source: "LMC 2025 HPB pathology s.36"}
  - {id: hepatomegaly, freq: occasional, source: "LMC 2025 HPB pathology s.36"}
  - {id: raised-ca19-9, freq: common, source: "LMC 2025 HPB pathology s.37"}
outcomes:
  - {id: acute-cholangitis, note: "Commoner than with HCC", source: "K&C 10e p.1310"}
