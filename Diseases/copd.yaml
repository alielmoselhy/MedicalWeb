id: copd
name: Chronic obstructive pulmonary disease
group: airways
status: draft
systems: [respiratory]
sources: ["K&C 10e p.955-957", "K&C 10e p.959", "Mehlman HY Pulmonary"]
chain:
  - {from: smoking, to: neutrophilic-airway-inflammation, note: "Smoking causes > 90% of cases in developed countries, yet only 10–20% of smokers get COPD", source: "K&C 10e p.955"}
  - {from: biomass-smoke, to: neutrophilic-airway-inflammation, note: "Indoor cooking and heating smoke matters in developing countries", source: "K&C 10e p.955"}
  - {from: smoking, to: mucus-hypersecretion, note: "Chronic bronchitis: productive cough on most days for 3 months a year, 2 years running", source: "K&C 10e p.955"}
  - [smoking, smoking-protease-excess]
  - {from: smoking-protease-excess, to: alveolar-wall-destruction, note: "Smokers get centri-acinar emphysema", source: "K&C 10e p.955-956"}
  - {from: a1at-deficiency-state, to: alveolar-wall-destruction, note: "Pan-acinar emphysema; ≈2% of UK emphysema", source: "K&C 10e p.956"}
  - {from: neutrophilic-airway-inflammation, to: small-airway-narrowing, note: "Neutrophils, CD8 cells and macrophages scar the small airways", source: "K&C 10e p.955"}
  - [mucus-hypersecretion, productive-cough]
  - [small-airway-narrowing, obstructive-spirometry]
  - [small-airway-narrowing, ventilation-perfusion-mismatch]
  - [ventilation-perfusion-mismatch, hypoxaemia]
  - {from: alveolar-wall-destruction, to: air-trapping, note: "Lost elastic recoil closes airways early in expiration", source: "K&C 10e p.956"}
  - [air-trapping, hyperinflated-chest]
  - [air-trapping, hyperinflation-imaging]
  - [alveolar-wall-destruction, diffusion-impairment]
  - [diffusion-impairment, reduced-tlco]
  - [small-airway-narrowing, alveolar-hypoventilation]
  - [alveolar-hypoventilation, hypercapnia]
  - {from: hypoxaemia, to: central-cyanosis, note: "Patients who lose their CO2 drive are cyanosed and oedematous; those who keep it are breathless but rarely cyanosed", source: "K&C 10e p.956"}
  - {from: hypoxaemia, to: secondary-polycythaemia, source: "K&C 10e p.957"}
  - [hypoxaemia, hypoxic-vasoconstriction]
  - {from: respiratory-virus, to: copd-exacerbation, note: "Many exacerbations are viral", source: "K&C 10e p.957"}
  - [haemophilus-influenzae, copd-exacerbation]
  - [streptococcus-pneumoniae, copd-exacerbation]
  - [small-airway-narrowing, exertional-dyspnoea]
  - [small-airway-narrowing, wheeze]
  - [ventilation-perfusion-mismatch, tachypnoea]
  - [hypoxic-vasoconstriction, pulmonary-hypertension]
  - [pulmonary-hypertension, cor-pulmonale]
  - [cor-pulmonale, peripheral-oedema]
  - [alveolar-hypoventilation, type-2-respiratory-failure]
  - [ventilation-perfusion-mismatch, type-1-respiratory-failure]
findings:
  - {id: productive-cough, freq: classic, note: "White or clear sputum", source: "K&C 10e p.956"}
  - {id: exertional-dyspnoea, freq: classic}
  - {id: obstructive-spirometry, freq: classic, note: "Diagnostic: post-bronchodilator FEV1/FVC < 0.7; reversibility usually < 15%; GOLD stage by FEV1", source: "K&C 10e p.957"}
  - {id: wheeze, freq: common}
  - {id: tachypnoea, freq: common}
  - {id: hypoxaemia, freq: common}
  - {id: hyperinflated-chest, freq: common, note: "Mild disease may have no signs", source: "K&C 10e p.956"}
  - {id: hyperinflation-imaging, freq: common, note: "CXR is often normal even in advanced disease; flat diaphragms ± bullae", source: "K&C 10e p.957"}
  - {id: reduced-tlco, freq: common, note: "Low when emphysema is significant", source: "K&C 10e p.957"}
  - {id: hypercapnia, freq: occasional}
  - {id: central-cyanosis, freq: occasional}
  - {id: secondary-polycythaemia, freq: occasional}
  - {id: peripheral-oedema, freq: occasional}
  - {id: weight-loss, freq: occasional, note: "Systemic effects: weight and muscle loss", source: "K&C 10e p.956"}
outcomes:
  - {id: copd-exacerbation, note: "Infection-triggered; can bring type 1 or type 2 respiratory failure", source: "K&C 10e p.959"}
  - {id: type-2-respiratory-failure, note: "Extra oxygen can push CO2 up further; give controlled oxygen, NIV if pH < 7.35", source: "K&C 10e p.959"}
  - type-1-respiratory-failure
  - {id: pulmonary-hypertension, note: "Later stages", source: "K&C 10e p.956"}
  - {id: cor-pulmonale, note: "Later stages", source: "K&C 10e p.956"}
  - {id: osteoporosis, freq: occasional, source: "K&C 10e p.956"}
