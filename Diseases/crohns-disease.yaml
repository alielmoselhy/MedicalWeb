id: crohns-disease
name: Crohn's disease
parent: inflammatory-bowel-disease
group: ibd
status: draft
systems: [gastrointestinal]
sources: ["K&C 10e p.1192, 1198-1205, 1222", "Mehlman HY Gastro"]
chain:
  - {from: smoking, to: gut-mucosal-immune-dysregulation, note: "Smokers are more likely to get Crohn's, flare and recur after surgery", source: "K&C 10e p.1198"}
  - [ibd-family-history, gut-mucosal-immune-dysregulation]
  - {from: gut-mucosal-immune-dysregulation, to: transmural-bowel-inflammation, note: "Anywhere mouth to anus, especially terminal ileum and ascending colon", source: "K&C 10e p.1200"}
  - {from: transmural-bowel-inflammation, to: non-caseating-granuloma, note: "Granulomas in 50–60%, as in sarcoidosis; ileocaecal TB is the key differential", source: "K&C 10e p.1201-1202; Mehlman HY Gastro"}
  - [non-caseating-granuloma, granulomas-on-biopsy]
  - [transmural-bowel-inflammation, skip-lesions-cobblestone]
  - [transmural-bowel-inflammation, diarrhoea]
  - [transmural-bowel-inflammation, abdominal-pain]
  - [transmural-bowel-inflammation, weight-loss]
  - [transmural-bowel-inflammation, perianal-disease]
  - [transmural-bowel-inflammation, mouth-ulcers]
  - {from: transmural-bowel-inflammation, to: bile-acid-malabsorption, note: "Terminal ileal disease or resection", source: "K&C 10e p.1202"}
  - [bile-acid-malabsorption, diarrhoea]
  - {from: transmural-bowel-inflammation, to: mucosal-malabsorption, note: "Small bowel disease: steatorrhoea, B12", source: "K&C 10e p.1202"}
  - [mucosal-malabsorption, steatorrhoea]
  - [mucosal-malabsorption, b12-folate-deficiency]
  - [transmural-bowel-inflammation, rif-pain]
  - [transmural-bowel-inflammation, rif-mass]
  - [gut-mucosal-immune-dysregulation, fever]
  - [mucosal-malabsorption, iron-deficiency-anaemia]
  - [gut-mucosal-immune-dysregulation, erythema-nodosum]
  - [transmural-bowel-inflammation, intestinal-stricture]
  - [intestinal-stricture, intestinal-obstruction]
  - [transmural-bowel-inflammation, intestinal-fistula]
  - [intestinal-stricture, small-intestinal-bacterial-overgrowth]
  - [bile-acid-malabsorption, gallstone-disease]
  - [mucosal-malabsorption, renal-calculi-nephrocalcinosis]
findings:
  - {id: diarrhoea, freq: classic, note: "80%; bloody in colonic disease", source: "K&C 10e p.1202"}
  - {id: abdominal-pain, freq: classic, note: "Colicky if obstructing", source: "K&C 10e p.1202"}
  - {id: weight-loss, freq: classic}
  - {id: rif-pain, freq: occasional, note: "Acute terminal ileitis can mimic appendicitis", source: "K&C 10e p.1202"}
  - {id: rif-mass, freq: occasional, note: "Matted inflamed loops or an abscess", source: "K&C 10e p.1202"}
  - {id: perianal-disease, freq: common, note: "The presenting feature in 25%", source: "K&C 10e p.1202"}
  - {id: mouth-ulcers, freq: common, source: "K&C 10e p.1202"}
  - {id: fever, freq: occasional, note: "Low-grade, with malaise and anorexia", source: "K&C 10e p.1202"}
  - {id: skip-lesions-cobblestone, freq: classic, note: "Colonoscopy with ileal biopsies; small bowel imaging is mandatory", source: "K&C 10e p.1202"}
  - {id: granulomas-on-biopsy, freq: common}
  - {id: erythema-nodosum, freq: occasional, note: "More with Crohn's (pyoderma with UC)", source: "Mehlman HY Gastro"}
outcomes:
  - {id: intestinal-stricture, note: "Untreated disease goes from inflammatory to stricturing to penetrating; half need resection within 5 years", source: "K&C 10e p.1202, 1205"}
  - {id: intestinal-obstruction, freq: occasional, source: "K&C 10e p.1222"}
  - {id: intestinal-fistula, note: "20–40%: bladder, vagina, skin", source: "K&C 10e p.1202"}
  - {id: small-intestinal-bacterial-overgrowth, source: "K&C 10e p.1192"}
  - {id: gallstone-disease, freq: occasional, note: "Ileal disease", source: "K&C 10e p.1202"}
  - {id: renal-calculi-nephrocalcinosis, freq: occasional, note: "Oxalate stones from fat malabsorption", source: "Mehlman HY Gastro"}
  - {id: iron-deficiency-anaemia, freq: common, note: "Also anaemia of chronic disease, folate; B12 deficiency is unusual", source: "K&C 10e p.1202"}
