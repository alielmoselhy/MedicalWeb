id: gallbladder-carcinoma
name: Gallbladder adenocarcinoma
group: biliary-pancreas
status: draft
systems: [gastrointestinal]
sources: ["K&C 10e p.1322", "Mehlman HY Gastro", "LMC 2025 HPB pathology s.20, 28-29"]
chain:
  - {from: gallstone-disease, to: gallbladder-inflammation, note: "Stones are present in 95%, and 0.5% of people with stones get it after 20+ years; K&C calls the causal link unproven. Commoner in women", source: "K&C 10e p.1322; LMC 2025 HPB pathology s.28"}
  - {from: gallbladder-inflammation, to: inflammation-driven-transformation, note: "Porcelain gall bladder (end-stage chronic cholecystitis) needs early cholecystectomy; so do polyps over 10 mm. Recent data put the cancer risk of porcelain gall bladder at about 6%", source: "K&C 10e p.1322; Mehlman HY Gastro; LMC 2025 HPB pathology s.20, 28"}
  - [inflammation-driven-transformation, biliary-tract-tumour]
  - {from: biliary-tract-tumour, to: local-tumour-invasion, note: "Early lymphatic spread into the liver and nearby bile ducts; 5-year survival < 5%", source: "K&C 10e p.1322"}
  - [biliary-tract-tumour, abdominal-pain]
  - [local-tumour-invasion, bile-duct-obstruction]
  - [bile-duct-obstruction, jaundice]
  - [biliary-tract-tumour, metastatic-spread]
  - [gallstone-disease, gallstones-on-imaging]
  - [biliary-tract-tumour, anorexia]
  - [bile-duct-obstruction, vomiting]
  - [metastatic-spread, distant-metastases]
findings:
  - {id: gallstones-on-imaging, freq: common, note: "Sometimes found by chance at cholecystectomy, when early resection may cure", source: "K&C 10e p.1322"}
  - {id: abdominal-pain, freq: common, note: "Insidious, like gallstone symptoms; usually found late or by chance", source: "LMC 2025 HPB pathology s.28"}
  - {id: jaundice, freq: common, source: "LMC 2025 HPB pathology s.28"}
  - {id: anorexia, freq: common, source: "LMC 2025 HPB pathology s.28"}
  - {id: vomiting, freq: common, source: "LMC 2025 HPB pathology s.28"}
outcomes:
  - {id: distant-metastases, note: "Peritoneum, GI tract, lungs; often already in the liver. 10% 5-year survival", source: "LMC 2025 HPB pathology s.29"}
