id: mesothelioma
name: Mesothelioma
group: lung-pleural-tumours
status: draft
systems: [respiratory]
sources: ["K&C 10e p.980", "Mehlman HY Pulmonary"]
chain:
  - {from: asbestos, to: carcinogen-induced-transformation, note: "Almost always asbestos; decades after exposure (shipyards, construction)", source: "K&C 10e p.980"}
  - {from: carcinogen-induced-transformation, to: pleural-thickening, note: "From the mesothelium of the pleura; tends to grow from pre-existing pleural plaques and encase the lung in a rind", source: "K&C 10e p.980"}
  - [pleural-thickening, exudative-effusion]
  - {from: pleural-thickening, to: chest-pain, note: "Persistent chest wall pain", source: "K&C 10e p.980"}
  - [exudative-effusion, dyspnoea]
  - [asbestos, pleural-plaques]
  - [pleural-thickening, malignant-pleural-effusion]
  - [pleural-thickening, respiratory-failure]
findings:
  - {id: exudative-effusion, freq: classic, note: "The commonest presentation, usually unilateral", source: "K&C 10e p.980"}
  - {id: chest-pain, freq: classic, note: "Persistent pain with an effusion raises suspicion even when tests are negative", source: "K&C 10e p.980"}
  - {id: pleural-thickening, freq: classic, note: "Calretinin-positive on staining; image-guided or VATS biopsy is often needed", source: "Mehlman HY Pulmonary"}
  - {id: pleural-plaques, freq: common}
  - {id: dyspnoea, freq: common}
  - {id: weight-loss, freq: common}
outcomes:
  - malignant-pleural-effusion
  - respiratory-failure
