id: peripheral-arterial-disease
name: Peripheral arterial disease
group: ischaemic-myocardial-pericardial
status: draft
systems: [cardiovascular]
sources: ["K&C 10e p.1128-1129", "K&C 10e p.1080"]
chain:
  - [smoking, endothelial-dysfunction]
  - [diabetes-mellitus, endothelial-dysfunction]
  - [hypertension, endothelial-dysfunction]
  - [hyperlipidaemia, endothelial-dysfunction]
  - [endothelial-dysfunction, peripheral-atherosclerosis]
  - [peripheral-atherosclerosis, limb-artery-stenosis]
  - [limb-artery-stenosis, limb-ischaemia]
  - {from: limb-ischaemia, to: intermittent-claudication, note: "Fontaine II: exertional calf pain eased by rest", source: "K&C 10e p.1128"}
  - {from: limb-ischaemia, to: rest-pain, note: "Fontaine III: night pain eased by hanging the foot down", source: "K&C 10e p.1128"}
  - [limb-ischaemia, trophic-skin-changes]
  - {from: limb-artery-stenosis, to: acute-limb-ischaemia, note: "Acute thrombosis on a chronic stenosis is the commoner cause of acute limb ischaemia", source: "K&C 10e p.1129"}
  - [limb-artery-stenosis, reduced-peripheral-pulses]
  - [limb-artery-stenosis, low-abpi]
  - [limb-artery-stenosis, femoral-bruit]
