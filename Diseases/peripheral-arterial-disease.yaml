findings:
  - {id: intermittent-claudication, freq: classic}
  - {id: reduced-peripheral-pulses, freq: classic}
  - {id: low-abpi, freq: classic, note: "0.5–0.9 in claudication, <0.5 in critical ischaemia; falsely high if vessels calcified", source: "K&C 10e p.1128"}
  - {id: trophic-skin-changes, freq: common, note: "Cold, dry, hairless skin"}
  - {id: rest-pain, freq: occasional}
  - {id: femoral-bruit, freq: occasional}
outcomes:
  - acute-limb-ischaemia
  - {id: gangrene-amputation, note: "Fontaine IV: necrosis/gangrene"}
  - {id: acute-coronary-syndrome, note: "Claudicants have 2–4× the risk of CAD, stroke and heart failure", source: "K&C 10e p.1080"}
  - ischaemic-stroke
