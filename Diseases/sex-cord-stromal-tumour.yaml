id: sex-cord-stromal-tumour
name: Sex cord-stromal tumour of the ovary
parent: ovarian-tumour
group: ovaries-tubes
status: draft
systems: [female-genital]
sources: ["K&C 10e p.131, 1475", "Mehlman HY Repro-OBGYN", "Mehlman HY Pulmonary"]
chain:
  - {from: sex-cord-stromal-growth, to: adnexal-mass, note: "Granulosa cell, Sertoli–Leydig cell, fibroma and other stromal tumours", source: "K&C 10e p.131, 1475; Mehlman HY Repro-OBGYN"}
  - {from: sex-cord-stromal-growth, to: unopposed-oestrogen, note: "Granulosa cell tumour makes oestrogen", source: "Mehlman HY Repro-OBGYN"}
