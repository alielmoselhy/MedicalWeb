  - {from: endometrial-proliferation, to: abnormal-uterine-bleeding, note: "Ovarian mass plus vaginal bleeding and a thick endometrial stripe: granulosa cell tumour", source: "Mehlman HY Repro-OBGYN"}
  - {from: endometrial-proliferation, to: endometrial-carcinoma, source: "Mehlman HY Repro-OBGYN"}
  - {from: sex-cord-stromal-growth, to: androgen-excess, note: "Sertoli–Leydig cell tumour makes androgen", source: "Mehlman HY Repro-OBGYN"}
