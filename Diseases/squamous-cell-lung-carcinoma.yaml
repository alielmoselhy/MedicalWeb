id: squamous-cell-lung-carcinoma
name: Squamous cell lung carcinoma
parent: nsclc
group: lung-pleural-tumours
status: draft
systems: [respiratory]
sources: ["K&C 10e p.976-978", "Mehlman HY Pulmonary"]
chain:
  - {from: smoking, to: carcinogen-induced-transformation, note: "Smoking is the biggest risk factor", source: "Mehlman HY Pulmonary"}
  - {from: carcinogen-induced-transformation, to: primary-lung-tumour, note: "Arises from bronchial epithelium and makes keratin; about 35% of UK cases", source: "K&C 10e p.976"}
  - [primary-lung-tumour, central-lung-mass]
  - {from: primary-lung-tumour, to: endobronchial-obstruction, note: "Obstructs a bronchus, with infection beyond it", source: "K&C 10e p.976"}
  - [endobronchial-obstruction, lung-collapse]
  - {from: primary-lung-tumour, to: cavitation, note: "Central necrosis; a cavitating lung cancer is squamous", source: "Mehlman HY Pulmonary"}
  - {from: primary-lung-tumour, to: local-tumour-invasion, note: "Local spread is common; metastasizes relatively late", source: "K&C 10e p.976"}
  - {from: primary-lung-tumour, to: pthrp-secretion, source: "K&C 10e p.978"}
  - {from: pthrp-secretion, to: hypercalcaemia, note: "Calcium up, phosphate down, PTH suppressed", source: "Mehlman HY Pulmonary"}
  - [endobronchial-obstruction, haemoptysis]
  - [endobronchial-obstruction, cough]
  - [pthrp-secretion, hypercalcaemia-of-malignancy]
  - [hypercalcaemia-of-malignancy, renal-calculi-nephrocalcinosis]
  - [endobronchial-obstruction, post-obstructive-pneumonia]
findings:
  - {id: central-lung-mass, freq: classic, note: "Central, like small-cell (the two 'S' cancers); keratin pearls on histology", source: "Mehlman HY Pulmonary"}
  - {id: cavitation, freq: common}
  - {id: hypercalcaemia, freq: common}
  - {id: haemoptysis, freq: common}
  - {id: cough, freq: common}
outcomes:
  - {id: hypercalcaemia-of-malignancy, note: "Stones, confusion; hypercalcaemic crisis can cause delirium", source: "Mehlman HY Pulmonary"}
  - {id: renal-calculi-nephrocalcinosis, source: "Mehlman HY Pulmonary"}
  - {id: post-obstructive-pneumonia, freq: common, source: "K&C 10e p.976"}
