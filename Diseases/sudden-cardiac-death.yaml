id: sudden-cardiac-death
name: Sudden cardiac death
group: ischaemic
status: draft
sources: ["K&C 10e p.1045", "K&C 10e p.1118 (Box 30.52)"]
chain:
  - {from: myocardial-ischaemia, to: ventricular-arrhythmia, note: "Coronary disease causes ~80% in Western populations; transient ischaemia is the suspected trigger", source: "K&C 10e p.1045"}
  - {from: myocardial-scar, to: ventricular-arrhythmia, note: "Old infarct, dilated or arrhythmogenic cardiomyopathy", source: "K&C 10e p.1118"}
  - {from: myocyte-disarray, to: ventricular-arrhythmia, note: "Hypertrophic cardiomyopathy: commonest cause of sudden death in the young", source: "K&C 10e p.1119"}
  - {from: ion-channel-mutation, to: ventricular-arrhythmia, note: "Congenital long QT, Brugada syndrome", source: "K&C 10e p.1118"}
  - {from: fixed-lvot-obstruction, to: ventricular-arrhythmia, note: "Valve disease (aortic stenosis, mitral prolapse) is on the cause list", source: "K&C 10e p.1118"}
  - {from: ventricular-arrhythmia, to: pulseless-collapse, note: "Most deaths are VF or fast VT; about half are almost instantaneous", source: "K&C 10e p.1045"}
  - {from: bradyarrhythmia, to: pulseless-collapse, note: "A small proportion", source: "K&C 10e p.1045"}
findings:
  - {id: pulseless-collapse, freq: classic}
  - {id: arrhythmic-syncope, freq: occasional, note: "Unheralded blackout can be the warning event"}
