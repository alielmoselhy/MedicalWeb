  - [pulmonary-hypertension, annular-dilatation]
  - [rheumatic-heart-disease, rheumatic-scarring]
  - {from: infective-endocarditis, to: leaflet-destruction, note: "Right-sided IE is typical in injecting drug users", source: "K&C 10e p.1103"}
  - [annular-dilatation, tricuspid-regurgitant-flow]
  - [rheumatic-scarring, tricuspid-regurgitant-flow]
  - [leaflet-destruction, tricuspid-regurgitant-flow]
  - [tricuspid-regurgitant-flow, rv-volume-overload]
  - [tricuspid-regurgitant-flow, systemic-venous-congestion]
  - [tricuspid-regurgitant-flow, giant-v-waves]
  - [tricuspid-regurgitant-flow, pulsatile-liver]
  - [tricuspid-regurgitant-flow, pansystolic-murmur]
  - [systemic-venous-congestion, peripheral-oedema]
  - [systemic-venous-congestion, high-saag-ascites]
  - [tricuspid-regurgitant-flow, atrial-dilatation]
  - [atrial-dilatation, irregularly-irregular-pulse]
  - [systemic-venous-congestion, heart-failure]
  - [atrial-dilatation, atrial-fibrillation]
findings:
  - {id: pansystolic-murmur, freq: classic, note: "Lower left sternal edge, louder on inspiration", source: "K&C 10e p.1101"}
  - {id: giant-v-waves, freq: classic}
  - {id: pulsatile-liver, freq: common}
  - {id: peripheral-oedema, freq: common}
  - {id: irregularly-irregular-pulse, freq: common, note: "AF is common", source: "K&C 10e p.1101"}
  - {id: high-saag-ascites, freq: occasional, note: "High-gradient ascites, as in other right-sided venous congestion", source: "K&C 10e p.1296"}
outcomes:
  - {id: heart-failure, note: "Right heart failure"}
  - atrial-fibrillation
