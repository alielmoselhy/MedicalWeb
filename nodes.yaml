# Shared vocabulary. Every non-disease node used in Diseases/*.yaml must be defined here.
# One node per line: {id, name, type, parent?, category?}
# type: cause | mechanism | finding | outcome
# parent: "is a kind of" (one parent, same type; an outcome may be a kind of disease). Siblings count as "related".
# category: findings → symptom | sign | lab | ECG | imaging | endoscopy (endoscopy and biopsy) · causes → organism | genetic | risk-factor | drug | condition
# (condition = a disease from another system, used as a cause until it gets its own file)
# Agreed in docs/concepts-cardio.md (step 5a). A child is indented under its parent purely for reading.

