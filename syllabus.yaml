# LMC Syllabus 2026: the sections (systems) and subsections (groups) that diseases are filed under, in syllabus order.
# A disease's `systems` lists section ids, its home system first; its `group` is a subsection id from that home system.
# Names follow the syllabus headings, shortened where they carry cross-references. Sections 1–2 and teaching-only
# subsections (e.g. "Approach to antimicrobial therapy") hold no diseases and are left out.

- id: biochemistry
  section: 3
  name: Clinical biochemistry
  groups:
    - {id: sodium-water, name: Sodium and water balance}
    - {id: potassium, name: Potassium handling}
    - {id: acid-base, name: Acid–base balance and blood gases}

- id: infection
  section: 4
  name: Microbiology and infection
  groups:
    - {id: sepsis, name: Sepsis}
    - {id: herpes-virus, name: Herpes virus infection}
    - {id: hiv, name: HIV infection}
    - {id: healthcare-associated-infection, name: Healthcare-associated infection}
    - {id: returning-traveller, name: Febrile returning traveller}

